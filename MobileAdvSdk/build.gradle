plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

ext {
    PUBLISH_GROUP_ID = 'com.greengray'
//    PUBLISH_VERSION = '1.5.1'
    PUBLISH_VERSION = '1.0.57'
    PUBLISH_ARTIFACT_ID = 'advsdk'
}

android {
    compileSdk 31

    defaultConfig {
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        buildTypes.each {
            it.buildConfigField "String", "PUBLISH_VERSION", "\"${PUBLISH_VERSION}\""
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        exclude 'META-INF/*'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4")
    implementation("com.google.guava:guava:31.1-android")
    implementation('com.greengray:deviceinfo:1.0.26')
//    implementation("com.google.android.gms:play-services-ads-identifier:18.0.1")
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.8.0'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    }
}


apply from: "../publish-module.gradle"